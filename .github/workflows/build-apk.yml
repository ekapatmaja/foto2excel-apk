name: Build Foto2Excel APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          unzip -q Foto2Excel_Android_GitHub_Build.zip
          test -d Foto2Excel_Android

      - name: Build APK
        working-directory: Foto2Excel_Android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foto2Excel-APK
          path: Foto2Excel_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
